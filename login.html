<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Manager Login</title><link rel="stylesheet" href="style.css"></head><body><main class="auth"><h1>Task Manager</h1><p>Sign in to continue</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><div id="msg"></div><p>New here? <a href="signup.html">Create an account</a></p></main><script>async function login(){msg.textContent="Logging in...";let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});let x=await r.json();if(x.success){localStorage.token=x.token;localStorage.user=JSON.stringify(x.user);location="index.html"}else msg.textContent=x.message}</script></body></html>
